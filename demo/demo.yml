# Compose override of the public demo: the showcase lab of docker-compose.yml,
# reachable from the network and protected by a login. See demo/README.md.
services:
  snapraid:
    ports: !override
      - "7627:7700"   # the demo stays on 7627 outside: its tunnel points there; DiskFlux listens on 7700 inside
    environment:
      # user:password of the browser login; empty: no login
      LAB_AUTH: "${DEMO_AUTH-demo:demo}"
      # a visitor cannot change the login and lock the others out until the next reset
      LAB_LOGIN_FIXED: "1"
