# SnapRAID lab: `docker compose up --build` from this folder, then open http://localhost:7700
#
# DAEMON_SRC is the checkout of https://github.com/paleka/diskflux (branch storage).
# By default it is expected next to this folder.
#
# This is the showcase lab: three arrays, four pools, disks of different sizes, kinds and
# filesystems, and configurations that use most options of SnapRAID and of its daemon.
# The README has the table of what is where. A small lab with one plain array:
#
#     docker compose -f docker-compose.simple.yml up --build
name: snapraid-lab
services:
  snapraid:
    build:
      context: .
      additional_contexts:
        daemon: ${DAEMON_SRC:-../diskflux-daemon}
    container_name: snapraid-lab
    # Needed to attach loop devices, mount the emulated disks and run mergerfs (FUSE).
    privileged: true
    init: true
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      LAB_PRESET: "${LAB_PRESET:-ready}"   # ready: arrays already built | blank: only empty disks, build them with the guided setup
      LAB_UI: "${LAB_UI:-quiet}"           # quiet | commander | brutale
      LAB_AUTH: "${LAB_AUTH:-}"            # user:password to try the login of the daemon; empty: no login
      LAB_LOGIN_FIXED: "${LAB_LOGIN_FIXED:-0}"   # 1: the login cannot be changed from the System page

      # Array "default": mixed disks, two parity levels
      LAB_DATA_DISKS: "4"            # data disks d1..dN
      LAB_PARITY_DISKS: "2"          # parity disks p1..pN (1..6): parity, 2-parity, ...
      LAB_SPARE_DISKS: "2"           # blank disks s1..sN, for adding and replacing from the UI
      # Array "media": large disks, one parity level split over two smaller disks
      LAB_MEDIA_DATA_DISKS: "3"      # data disks m1..mN, parity q1; 0: no such array
      LAB_MEDIA_SPLIT_PARITY: "1"    # 1: the parity is split over q1 and q2
      # Array "flash": NVMe and SSD on Btrfs, synced from snapshots
      LAB_FLASH_DATA_DISKS: "3"      # data disks f1..fN, parity g1; 0: no such array
      # Outside the arrays
      LAB_SCRATCH_DISKS: "1"         # x1..xN: mounted, pooled in /mnt/scratch, no parity
      LAB_USB_DISKS: "1"             # u1..uN: mounted on their own, no pool, no parity
      LAB_POOLS: "1"                 # 1: a mergerfs pool over the data disks of every array, and /mnt/scratch

      LAB_DISK_SIZE_MB: "512"        # size of the disks not named below
      # A number is MB; 12T or 500G is a real drive of that label. The large disks cost nothing: their
      # images are sparse, a few real files are written and the rest of their room is taken without
      # writing it ("lab space"). What needs a really full disk stays small, with real files: the default
      # array (unbalanced pool, mass delete, dead disks, full-disk tips), q1 (the first half of the split
      # parity fills up) and x1 (too small for a parity).
      # q2 = 12T less the 256 MB of q1: the two halves together are as large as m1.
      LAB_DISK_SIZES: >-
        d1=256 d2=512 d3=768 d4=384 p1=1024 p2=1024 s1=16T s2=1T
        m1=12T m2=6T m3=8T q1=256 q2=11446066
        f1=2T f2=2T f3=1T g1=2T
        x1=256 u1=2T
      # hdd | smr | ssd | nvme | sas | usb
      LAB_DISK_TYPES: >-
        d1=hdd d2=smr d3=sas d4=ssd p1=hdd p2=hdd s1=hdd s2=usb
        m1=hdd m2=smr m3=hdd q1=hdd q2=hdd
        f1=nvme f2=nvme f3=ssd g1=nvme
        x1=ssd u1=usb
      # ext4 (default) | xfs | btrfs
      LAB_DISK_FS: "d2=xfs d4=btrfs m1=xfs m2=xfs m3=xfs q2=xfs f1=btrfs f2=btrfs f3=btrfs"
      # 1: the configurations use the less common options too (extra, nohidden, temp_limit, pool,
      # smartctl, smartignore, snapshot; hook, notifications, prehash, compressed logs, ...)
      LAB_SHOWCASE: "1"
    volumes:
      # Disk images, array config, logs. `docker compose down -v` resets the lab.
      - lab:/lab
      # Live UI sources: edit them in the checkout and just reload the browser.
      - ${DAEMON_SRC:-../diskflux-daemon}/commander:/ui/commander
      - ${DAEMON_SRC:-../diskflux-daemon}/brutale:/ui/brutale
      - ${DAEMON_SRC:-../diskflux-daemon}/quiet:/ui/quiet
    stop_grace_period: 20s
volumes:
  lab:
